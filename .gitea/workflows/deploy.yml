name: Build Games

# Gitea는 미러라 pull_request 이벤트가 오지 않는다. 모든 브랜치를
# 빌드해야 report job이 GitHub PR head SHA에 상태를 달 수 있다.
on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build SDK
        run: pnpm --filter @playground/sdk build

      - name: Build all games
        run: pnpm -r --filter './games/*' build

      - name: Verify builds
        run: |
          count=0
          for game in games/*/; do
            if [ -f "$game/dist/index.html" ]; then
              count=$((count+1))
            else
              echo "❌ $(basename $game) missing dist"
              exit 1
            fi
          done
          echo "✅ $count games built successfully"

  # Gitea 결과를 GitHub 커밋에 되돌려 PR에 체크로 보이게 한다. 미러에는 PR
  # 객체가 없지만 head 커밋 SHA는 같으므로 그 SHA에 status를 달면 된다.
  # GH_STATUS_TOKEN이 없으면 실패가 아니라 no-op으로 지나간다.
  report:
    runs-on: ubuntu-latest
    needs: [build]
    if: always()
    steps:
      - name: Report status to GitHub
        env:
          GH_STATUS_TOKEN: ${{ secrets.GH_STATUS_TOKEN }}
          STATE: ${{ needs.build.result == 'success' && 'success' || 'failure' }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_number }}
        run: |
          if [ -z "$GH_STATUS_TOKEN" ]; then
            echo "GH_STATUS_TOKEN is not set — skipping the GitHub status report."
            exit 0
          fi
          printf '{"state":"%s","context":"gitea/ci","target_url":"%s","description":"Gitea Actions"}' \
            "$STATE" "$TARGET_URL" > /tmp/status.json
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_STATUS_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d @/tmp/status.json >/dev/null
          echo "Reported $STATE to GitHub."
